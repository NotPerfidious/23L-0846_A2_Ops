{% extends "base.html" %}
{% block content %}
<div class="text-center mb-6">
    <h2 class="text-2xl font-bold">Image Verification</h2>
    <p class="text-gray-500 text-sm mt-1">Upload an image to detect if it is AI-generated.</p>
</div>
<form action="/upload" method="post" enctype="multipart/form-data" class="space-y-4">
    <div class="border-2 border-dashed border-gray-300 rounded-lg p-6 hover:border-indigo-500 transition-colors">
        <input type="file" name="file" id="file"
            class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 cursor-pointer"
            required>
    </div>
    <button type="submit"
        class="w-full bg-indigo-600 text-white font-semibold py-3 rounded-lg hover:bg-indigo-700 transition-colors">Analyze
        Image</button>
</form>
{% endblock %}
